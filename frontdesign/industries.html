<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0d0a" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Stockbot Industries — sector and stock analysis with live announcements from NSE." />
  <meta property="og:title" content="Stockbot — Industries" />
  <meta property="og:description" content="Sector and stock analysis with live announcements from NSE." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='85' font-size='90' fill='%230f0e0c'%3ES%3C/text%3E%3C/svg%3E" />
  <title>Stockbot — Industries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand__mark">S</span>
      <div class="brand__label">
        <div class="brand__title">The Industries Desk</div>
        <div class="brand__sub" id="indSub">Sectors · stocks · 90-day announcement flow</div>
      </div>
    </div>

    <nav class="topbar__center topnav" id="topNav" aria-label="Sections">
      <a class="topnav__link" href="index.html">Dashboard</a>
      <a class="topnav__link topnav__link--active" href="industries.html">Industries</a>
      <a class="topnav__link" href="industries.html#/news" id="navNews">
        News<span class="topnav__badge" id="navNewsBadge" hidden>0</span>
      </a>
      <a class="topnav__link" href="industries.html#/after-market" id="navAfter">
        After-Market<span class="topnav__badge" id="navAfterBadge" hidden>0</span>
      </a>
      <a class="topnav__link" href="industries.html#/yesterday" id="navYday">
        Yesterday<span class="topnav__badge" id="navYdayBadge" hidden>0</span>
      </a>
    </nav>

    <div class="topbar__right">
      <button id="navToggle" class="iconbtn iconbtn--menu" aria-label="Open menu"
              aria-controls="topNav" aria-expanded="false">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <button id="themeToggle" class="iconbtn" aria-label="Toggle theme">◐</button>
    </div>
    <div class="nav-backdrop" id="navBackdrop" hidden></div>
  </header>

  <aside class="live-ticker" id="liveTicker" hidden>
    <span class="live-ticker__dot" aria-hidden="true"></span>
    <span class="live-ticker__label">Live · NSE</span>
    <ol class="live-ticker__list" id="liveTickerList"></ol>
    <span class="live-ticker__time" id="liveTickerTime"></span>
  </aside>

  <main class="ind-main">
    <div class="ind-toolbar">
      <input id="indSearch"
             class="ind-search"
             type="search"
             placeholder="Search industries or stocks (e.g. steel, RELIANCE, banks)…"
             autocomplete="off"
             spellcheck="false" />
      <div class="ind-meta muted" id="indMeta">—</div>
    </div>

    <div id="indView"><!-- view rendered by industries.js --></div>

    <footer class="footer">
      <span class="muted">Stockbot · industries view · refreshed daily at 19:30 IST</span>
      <span class="muted" id="indGeneratedAt"></span>
    </footer>
  </main>

  <script src="industries.js" defer></script>
  <noscript>
    <div style="padding: 24px; color: #ef4444;">
      <p><strong>JavaScript is required for this dashboard.</strong></p>
      <p>Please enable JavaScript in your browser to view Stockbot.</p>
    </div>
  </noscript>
</body>
</html>
