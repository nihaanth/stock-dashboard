<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stockbot — Prediction Review</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand__mark">SB</span>
      <div class="brand__label">
        <div class="brand__title">Stockbot Review</div>
        <div class="brand__sub" id="dateLine">Pred: — → Result: —</div>
      </div>
    </div>

    <div class="topbar__center">
      <label class="picker">
        <span class="picker__label">Prediction date</span>
        <select id="datePicker"></select>
      </label>
      <div class="alltime" id="allTime">All-time accuracy: —</div>
    </div>

    <div class="topbar__right">
      <button id="themeToggle" class="iconbtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__hdr"><div>History</div><span class="muted" id="sidebarCount">0</span></div>
      <ul class="datelist" id="dateList"></ul>
      <div class="sidebar__hdr sidebar__hdr--sub"><div>Sources today</div></div>
      <div class="srcsumm" id="srcSumm"></div>
    </aside>

    <main class="main">
      <div class="srctabs" id="srcTabs"></div>

      <section class="cards" id="summaryCards">
        <!-- 6 summary cards injected by JS -->
      </section>

      <section class="filters">
        <div class="filter">
          <label>Direction</label>
          <select id="filterDir">
            <option value="all">All</option>
            <option value="bullish">Bullish</option>
            <option value="bearish">Bearish</option>
            <option value="sideways">Sideways</option>
          </select>
        </div>
        <div class="filter">
          <label>Min confidence <span id="confVal">0</span></label>
          <input type="range" id="filterConf" min="0" max="100" value="0" />
        </div>
        <div class="filter">
          <label>Sort</label>
          <select id="sortBy">
            <option value="default">Default (combined rank)</option>
            <option value="gain">Biggest gain</option>
            <option value="loss">Biggest loss</option>
            <option value="accuracy">Correct first</option>
            <option value="confidence">Confidence ↓</option>
          </select>
        </div>
        <div class="filter filter--note">
          <span class="legend"><i class="dot dot--green"></i> Correct</span>
          <span class="legend"><i class="dot dot--red"></i> Wrong</span>
          <span class="legend"><i class="dot dot--grey"></i> Sideways</span>
        </div>
      </section>

      <section class="tablewrap">
        <table class="ptable" id="ptable">
          <thead>
            <tr>
              <th>#</th>
              <th>Ticker</th>
              <th>Company</th>
              <th>Dir</th>
              <th class="num">Prev close</th>
              <th class="num">Last</th>
              <th class="num">Δ</th>
              <th class="num">%</th>
              <th>Result</th>
              <th>Signals</th>
              <th class="num">Conf</th>
              <th>S / R</th>
              <th class="grow notes-col">Notes</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <footer class="footer">
        <span class="muted">Stockbot · static dashboard · data refreshed daily at 19:30 IST</span>
        <span class="muted" id="generatedAt"></span>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
