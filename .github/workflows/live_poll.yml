name: live · NSE announcement poll

# Hits the NSE corporate-announcements API every 5 minutes during the IST
# trading session, writes frontdesign/data/industries/_live_news.json and
# commits the diff back to main. Vercel auto-deploys on push.
#
# Schedule: */5 03-10 * * 1-5 UTC = every 5 min between 08:30 and 16:25 IST,
# Mon-Fri. (NSE market hours are 09:15-15:30 IST; we widen on both ends so
# preopen disclosures and post-close filings are captured.)
#
# The script self-gates: it still runs outside this window if triggered
# manually via workflow_dispatch, just classifies market_state as "closed".

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Need full token so subsequent push has write perms
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Poll NSE
        run: python scripts/poll_live_news.py || true

      - name: Commit + push if changed
        run: |
          set -e
          git config user.name  "stockbot-live[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILE=frontdesign/data/industries/_live_news.json
          if git diff --quiet -- "$FILE"; then
            echo "no diff in $FILE — skipping commit"
            exit 0
          fi

          git add "$FILE"
          git commit -m "live: announcements $(TZ=Asia/Kolkata date +%H:%M)"

          # Rebase on anything that landed during our run, then push
          git pull --rebase --autostash origin main
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push failed; retrying after rebase"
            git pull --rebase --autostash origin main
          done
          echo "push failed after 3 attempts"
          exit 1
